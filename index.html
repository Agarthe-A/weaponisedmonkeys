<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeaponisedMonkeys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Ops+One&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one column, three numbered steps stacked like stencilled ammo crates. Single theme by choice. */
  color-scheme: dark;
  --drab: #262b1e;        /* page background, olive drab */
  --crate: #343b28;       /* panels */
  --crate-edge: #4c5539;  /* borders, dividers */
  --sand: #ece4c8;        /* text */
  --sand-dim: #b3ad92;    /* secondary text */
  --banana: #ffd23f;      /* accent */
  --ink: #15180f;         /* text on accent, inputs */
  --alert: #ff8a5c;       /* error messages */
  --font-display: "Black Ops One", "Stencil", "Impact", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--drab);
  color: var(--sand);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 3px solid var(--banana);
  padding-bottom: 14px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.7rem, 8vw, 2.9rem);
  line-height: 0.95;
  letter-spacing: 0.01em;
  margin: 0 0 8px;
  text-transform: uppercase;
  text-wrap: balance;
}
h1 span { color: var(--banana); display: block; }
.tagline { margin: 0; color: var(--sand-dim); font-size: 0.95rem; max-width: 34em; }
.lang { display: flex; flex: none; border: 2px solid var(--crate-edge); border-radius: 4px; overflow: hidden; }
.lang button {
  font: 600 0.85rem var(--font-body);
  background: transparent; color: var(--sand-dim);
  border: 0; padding: 8px 10px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--banana); color: var(--ink); }

section {
  background: var(--crate);
  border: 1px solid var(--crate-edge);
  border-radius: 6px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.15rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0;
  display: flex; align-items: baseline; gap: 10px;
}
h2 .num { color: var(--banana); }
.help { margin: 0; color: var(--sand-dim); font-size: 0.9rem; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.full { grid-column: 1 / -1; }
@media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
label, .label {
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--sand-dim);
}
select, input[type="text"], textarea {
  width: 100%;
  font: 500 1rem var(--font-body);
  color: var(--sand);
  background: var(--ink);
  border: 1px solid var(--crate-edge);
  border-radius: 4px;
  padding: 11px 12px;
}
select { appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--banana) 50%), linear-gradient(135deg, var(--banana) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%;
  background-size: 6px 6px; background-repeat: no-repeat; padding-right: 34px;
}
textarea {
  font: 400 0.88rem/1.5 var(--font-mono);
  min-height: 190px; resize: vertical;
}
:focus-visible { outline: 3px solid var(--banana); outline-offset: 2px; }

.squad { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; border: 1px solid var(--crate-edge); border-radius: 4px; overflow: hidden; max-width: 100%; }
.chip button { font: 500 0.9rem var(--font-body); background: var(--ink); color: var(--sand); border: 0; padding: 9px 10px; cursor: pointer; text-align: left; }
.chip button.rm { border-left: 1px solid var(--crate-edge); color: var(--sand-dim); padding: 9px 11px; }
.chip.on { border-color: var(--banana); }
.chip.on button.pick { background: var(--banana); color: var(--ink); font-weight: 600; }
.add { font: 600 0.9rem var(--font-body); background: transparent; color: var(--banana); border: 1px dashed var(--banana); border-radius: 4px; padding: 9px 12px; cursor: pointer; }
.add:disabled { opacity: 0.4; cursor: not-allowed; }
.seg { display: flex; border: 1px solid var(--crate-edge); border-radius: 4px; overflow: hidden; }
.seg button {
  flex: 1; font: 600 0.95rem var(--font-body);
  background: var(--ink); color: var(--sand-dim);
  border: 0; padding: 11px 8px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--crate-edge); }
.seg button[aria-pressed="true"] { background: var(--sand); color: var(--ink); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: 400 1rem var(--font-display);
  letter-spacing: 0.05em; text-transform: uppercase;
  border-radius: 4px; padding: 13px 18px; cursor: pointer;
  border: 2px solid var(--banana);
  background: var(--banana); color: var(--ink);
  flex: 1 1 auto; text-align: center;
}
.btn.ghost { background: transparent; color: var(--banana); }
a.btn { text-decoration: none; display: inline-block; }
.send { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
[hidden] { display: none !important; }
.send .btn { padding: 12px 6px; font-size: 0.92rem; }

.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(1px); }
@media (prefers-reduced-motion: reduce) { .btn:active:not(:disabled) { transform: none; } }

.status { min-height: 1.3em; margin: 0; font-size: 0.9rem; color: var(--banana); }
.status.err { color: var(--alert); }

.stage { background: var(--ink); border: 1px solid var(--crate-edge); border-radius: 4px; padding: 8px; }
canvas, #fallbackImg { display: block; width: 100%; height: auto; max-width: 100%; border-radius: 2px; }
#fallbackWrap { display: none; flex-direction: column; gap: 8px; }
#fallbackWrap.on { display: flex; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.filebtn { position: relative; display: block; }
.filebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.filebtn:focus-within .btn { outline: 3px solid var(--banana); outline-offset: 2px; }
.filebtn .btn { display: block; }
footer { color: var(--sand-dim); font-size: 0.8rem; }
footer p { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Weaponised <span>Monkeys</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" id="langFr" aria-pressed="true">FR</button>
      <button type="button" id="langEn" aria-pressed="false">EN</button>
    </div>
  </header>

  <section aria-labelledby="h-brief">
    <h2 id="h-brief"><span class="num">01</span><span data-i18n="s1"></span></h2>
    <div class="field">
      <span class="label" id="countLabel" data-i18n="count"></span>
      <div class="seg" id="count" role="group" aria-labelledby="countLabel">
        <button type="button" data-n="1">1</button><button type="button" data-n="2">2</button><button type="button" data-n="3">3</button><button type="button" data-n="4">4</button><button type="button" data-n="5">5</button>
      </div>
    </div>
    <div class="field">
      <label for="crowd" data-i18n="crowd"></label>
      <select id="crowd"></select>
      <p class="help" data-i18n="crowdHelp"></p>
    </div>
    <div class="field">
      <span class="label" id="squadLabel" data-i18n="squad"></span>
      <div class="squad" id="squad" role="group" aria-labelledby="squadLabel"></div>
      <p class="help" data-i18n="squadHelp"></p>
    </div>
    <div class="grid">
      <div class="field full">
        <label for="species" data-i18n="species"></label>
        <select id="species"></select>
      </div>
      <div class="field full">
        <span class="label" id="modeLabel" data-i18n="weaponBy"></span>
        <div class="seg" role="group" aria-labelledby="modeLabel">
          <button type="button" id="modeNation" aria-pressed="true" data-i18n="byNation"></button>
          <button type="button" id="modeType" aria-pressed="false" data-i18n="byType"></button>
        </div>
      </div>
      <div class="field">
        <label for="group" id="groupLabel"></label>
        <select id="group"></select>
      </div>
      <div class="field">
        <label for="weapon" data-i18n="weapon"></label>
        <select id="weapon"></select>
      </div>
      <div class="field full">
        <label for="faction" data-i18n="faction"></label>
        <select id="faction"></select>
      </div>
      <div class="field full">
        <label for="scenario" data-i18n="scenario"></label>
        <select id="scenario"></select>
      </div>
      <div class="field">
        <label for="decor" data-i18n="decor"></label>
        <select id="decor"></select>
      </div>
      <div class="field">
        <label for="moment" data-i18n="moment"></label>
        <select id="moment"></select>
      </div>
      <div class="field full">
        <span class="label" id="outLabel" data-i18n="output"></span>
        <div class="seg" role="group" aria-labelledby="outLabel">
          <button type="button" id="outImage" aria-pressed="true" data-i18n="outImage"></button>
          <button type="button" id="outVideo" aria-pressed="false" data-i18n="outVideo"></button>
        </div>
      </div>
      <div class="field full" id="emoteField" hidden>
        <label for="emote" data-i18n="emote"></label>
        <select id="emote"></select>
      </div>
      <div class="field">
        <label for="style" data-i18n="style"></label>
        <select id="style"></select>
      </div>
      <div class="field">
        <label for="ratio" data-i18n="ratio"></label>
        <select id="ratio"></select>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn ghost" id="random" data-i18n="random"></button>
    </div>
  </section>

  <section aria-labelledby="h-prompt">
    <h2 id="h-prompt"><span class="num">02</span><span data-i18n="s2"></span></h2>
    <p class="help" data-i18n="promptHelp"></p>
    <div class="field">
      <label for="prompt" class="visually-hidden" data-i18n="s2"></label>
      <textarea id="prompt" readonly spellcheck="false"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="copy" data-i18n="copy"></button>
    </div>
    <p class="status" id="copyStatus" role="status" aria-live="polite"></p>
    <span class="label" data-i18n="sendTo"></span>
    <div class="send">
      <a class="btn ghost" id="toGpt" target="_blank" rel="noopener" href="https://chatgpt.com/">ChatGPT</a>
      <a class="btn ghost" id="toGrok" target="_blank" rel="noopener" href="https://grok.com/">Grok</a>
      <a class="btn ghost" id="toGemini" target="_blank" rel="noopener" href="https://gemini.google.com/app">Gemini</a>
      <a class="btn ghost" id="toHiggs" target="_blank" rel="noopener" href="https://higgsfield.ai/">Higgsfield</a>
    </div>
    <p class="help" data-i18n="sendHelp"></p>
  </section>

  <section aria-labelledby="h-meme">
    <h2 id="h-meme"><span class="num">03</span><span data-i18n="s3"></span></h2>
    <p class="help" data-i18n="memeHelp"></p>
    <label class="filebtn">
      <input type="file" id="file" accept="image/*">
      <span class="btn ghost" data-i18n="import"></span>
    </label>
    <div class="grid">
      <div class="field full">
        <label for="topText" data-i18n="top"></label>
        <input type="text" id="topText" autocomplete="off">
      </div>
      <div class="field full">
        <label for="bottomText" data-i18n="bottom"></label>
        <input type="text" id="bottomText" autocomplete="off">
      </div>
    </div>
    <div class="stage"><canvas id="canvas" width="1080" height="1350"></canvas></div>
    <div class="actions">
      <button type="button" class="btn" id="save" data-i18n="save" disabled></button>
    </div>
    <p class="status" id="saveStatus" role="status" aria-live="polite"></p>
    <div id="fallbackWrap">
      <p class="help" data-i18n="saveFallback"></p>
      <div class="stage"><img id="fallbackImg" alt=""></div>
    </div>
  </section>

  <footer><p data-i18n="footer"></p></footer>
</div>

  var mode = "nation";
  var out = "image";
  var MAX = 5, squad = [{ s: "babychimp", w: "PKM" }], active = 0, ready = false;
  var li = function () { return lang === "fr" ? 1 : 2; };
  var $ = function (id) { return document.getElementById(id); };
  var el = {
    species: $("species"), group: $("group"), weapon: $("weapon"), faction: $("faction"),
    crowd: $("crowd"), scenario: $("scenario"), decor: $("decor"), moment: $("moment"),
    style: $("style"), ratio: $("ratio"), emote: $("emote"), prompt: $("prompt"), canvas: $("canvas"),
    topText: $("topText"), bottomText: $("bottomText"), save: $("save")
  };
  var ctx = el.canvas.getContext("2d");
  var img = null;

  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i][0] === id) return list[i]; return list[0]; }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  function fill(select, items, keep) {
    var prev = keep === undefined ? select.value : keep;
    select.textContent = "";
    items.forEach(function (it) {
      var o = document.createElement("option");
      o.value = it.value; o.textContent = it.label;
      select.appendChild(o);
    });
    if (items.some(function (it) { return it.value === prev; })) select.value = prev;
  }
  function simple(list) { return list.map(function (r) { return { value: r[0], label: r[li()] }; }); }

  function fillGroup(keep) {
    $("groupLabel").textContent = T[lang][mode === "nation" ? "nation" : "type"];
    fill(el.group, simple(mode === "nation" ? NATIONS : TYPES), keep);
  }
  function fillWeapons(keep) {
    var g = el.group.value;
    var items = WEAPONS.filter(function (w) { return (mode === "nation" ? w[1] : w[2]) === g; }).map(function (w) {
      var extra = mode === "nation" ? find(TYPES, w[2])[li()] : find(NATIONS, w[1])[li()];
      return { value: w[0], label: wname(w) + " · " + extra };
    });
    fill(el.weapon, items, keep);
  }

  function wname(w) { return lang === "fr" && w[4] ? w[4] : w[0]; }
  function hold(w) {
    if (w[3]) return w[3];
    var ty = find(TYPES, w[2]);
    return w[2] === "pi" ? "holding a " + w[0] + " pistol in one hand"
      : w[2] === "rl" ? "resting a " + w[0] + " " + ty[3] + " on its shoulder"
      : "gripping a " + w[0] + " " + ty[3] + " with both hands";
  }
  function renderSquad() {
    var box = $("squad"); box.textContent = "";
    document.querySelectorAll("#count button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(Number(b.getAttribute("data-n")) === squad.length));
    });
    squad.forEach(function (m, i) {
      var chip = document.createElement("div"); chip.className = "chip" + (i === active ? " on" : "");
      var b = document.createElement("button"); b.type = "button"; b.className = "pick";
      b.setAttribute("aria-pressed", String(i === active));
      b.textContent = (i + 1) + " · " + find(SPECIES, m.s)[li()] + " · " + wname(find(WEAPONS, m.w));
      b.addEventListener("click", function () { selectMember(i); });
      chip.appendChild(b);
      if (squad.length > 1) {
        var r = document.createElement("button"); r.type = "button"; r.className = "rm"; r.textContent = "×";
        r.setAttribute("aria-label", T[lang].remove + " " + (i + 1));
        r.addEventListener("click", function () {
          squad.splice(i, 1);
          if (active >= squad.length) active = squad.length - 1; else if (i < active) active--;
          selectMember(active);
        });
        chip.appendChild(r);
      }
      box.appendChild(chip);
    });
    var add = document.createElement("button"); add.type = "button"; add.className = "add";
    add.textContent = T[lang].addMonkey; add.disabled = squad.length >= MAX;
    add.addEventListener("click", function () {
      if (squad.length >= MAX) return;
      squad.push({ s: pick(SPECIES)[0], w: pick(WEAPONS)[0] });
      selectMember(squad.length - 1);
    });
    box.appendChild(add);
  }
  function setCount(n) {
    while (squad.length < n) squad.push({ s: pick(SPECIES)[0], w: pick(WEAPONS)[0] });
    squad.length = n;
    selectMember(Math.min(active, n - 1));
  }
  function selectMember(i) {
    active = i; ready = false;
    var w = find(WEAPONS, squad[i].w);
    el.species.value = squad[i].s;
    ready = true;
    setMode(mode, mode === "nation" ? w[1] : w[2], w[0]);
    status("copyStatus", "");
  }
  function lead() { return out === "video" ? "Generate a video: " : "Generate an image: "; }
  function setOut(o) {
    out = o;
    $("outImage").setAttribute("aria-pressed", String(o === "image"));
    $("outVideo").setAttribute("aria-pressed", String(o === "video"));
    $("emoteField").hidden = o !== "video";
    status("copyStatus", ""); buildPrompt();
  }
  function buildPrompt() {
    if (!ready) return;
    squad[active] = { s: el.species.value, w: el.weapon.value };
    renderSquad();
    var f = find(FACTIONS, el.faction.value);
    var st = find(STYLES, el.style.value);
    var who;
    if (squad.length === 1) {
      who = "The subject is " + find(SPECIES, squad[0].s)[3] + ", " + f[3] + ", " + hold(find(WEAPONS, squad[0].w)) + ". ";
    } else {
      who = "The subjects are " + squad.length + " primates posing shoulder to shoulder like a squad photo: " +
        squad.map(function (m, i) { return "(" + (i + 1) + ") " + find(SPECIES, m.s)[3] + " " + hold(find(WEAPONS, m.w)); }).join("; ") + ". " +
        "Each one is " + f[3] + ". Every animal and every weapon is clearly distinct and fully visible. ";
    }
    var cr = find(CROWDS, el.crowd.value)[3];
    if (cr) {
      who += (squad.length === 1 ? "It stands" : "They stand") + " in the front row of " +
        (cr < 0 ? "an entire army of hundreds of armed primates of mixed species, ranks stretching all the way to the horizon"
                : "a troop of " + cr + " armed primates of mixed species in total") +
        ", the others dressed the same way and carrying an assortment of similar weapons, packed behind and slightly out of focus. ";
    }
    var many = squad.length > 1 || !!cr;
    var sc = find(SCENARIOS, el.scenario.value);
    var scene = sc[many ? 4 : 3] + ". ";
    var dec = find(DECORS, el.decor.value), mo = find(MOMENTS, el.moment.value);
    var setting = "Setting: " + (dec[3] || f[4]) + ". " +
      (mo[3] ? "Time and light: " + mo[3] + (dec[3] ? "" : ", overriding any other lighting cue") + ". " : "");
    if (out === "video") {
      el.prompt.value =
        VIDEO_LEADS[st[0]] + ". " + who +
        (sc[0] === "portrait" ? "" : "Opening situation: " + scene) +
        "Action: " + (many ? "they all perform " : "the animal performs ") + find(EMOTES, el.emote.value)[3] +
        (many ? ", perfectly in sync, weapons still in hand, with dead-serious faces, then they freeze and stare at the camera. "
              : ", weapon still in hand, with a dead-serious face, then freezes and stares at the camera. ") +
        setting +
        "Smooth natural motion, stable anatomy and fur, weapons stay correctly proportioned, absurd deadpan humour. " +
        "No humans in focus, no text, no captions, no watermark, no logos. " +
        "Duration about 5 seconds. Aspect ratio " + el.ratio.value + ".";
    } else {
      el.prompt.value =
        st[3] + ". " + who + scene +
        (sc[0] === "portrait" ? "" : (many ? "Their faces stay dead-serious throughout. " : "Its face stays dead-serious throughout. ")) +
        setting +
        "Accurate animal anatomy and fur, weapons correctly proportioned and recognisable, absurd deadpan humour. " +
        "No humans in focus, no text, no captions, no watermark, no logos. " +
        "Leave clear space at the top and bottom of the frame for meme captions. " +
        "Aspect ratio " + el.ratio.value + ".";
    }
    var q = encodeURIComponent(lead() + el.prompt.value);
    $("toGpt").href = "https://chatgpt.com/?q=" + q;
    $("toGrok").href = "https://grok.com/?q=" + q;
  }

  /* ---------- Meme canvas ---------- */
  function wrap(text, maxW) {
    var words = text.split(/\s+/), lines = [], line = "";
    words.forEach(function (word) {
      var test = line ? line + " " + word : word;
      if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; } else { line = test; }
    });
    if (line) lines.push(line);
    return lines;
  }
  function caption(text, pos) {
    text = (text || "").trim().toUpperCase();
    if (!text) return;
    var W = el.canvas.width, H = el.canvas.height;
    var size = Math.round(W / 9), lines;
    for (;;) {
      ctx.font = size + "px Anton, Impact, 'Arial Narrow', sans-serif";
      lines = wrap(text, W * 0.92);
      var widest = Math.max.apply(null, lines.map(function (l) { return ctx.measureText(l).width; }));
      if ((lines.length <= 3 && widest <= W * 0.94) || size < W / 30) break;
      size = Math.round(size * 0.9);
    }
    var lh = size * 1.14, pad = H * 0.025;
    var y = pos === "top" ? pad : H - pad - lines.length * lh;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.lineJoin = "round"; ctx.miterLimit = 2;
    ctx.lineWidth = Math.max(3, size / 6);
    ctx.strokeStyle = "#000"; ctx.fillStyle = "#fff";
    lines.forEach(function (l, i) {
      ctx.strokeText(l, W / 2, y + i * lh);
      ctx.fillText(l, W / 2, y + i * lh);
    });
  }
  function draw() {
    var W = el.canvas.width, H = el.canvas.height;
    if (img) {
      ctx.drawImage(img, 0, 0, W, H);
    } else {
      ctx.fillStyle = "#4a5238"; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "#414931"; ctx.lineWidth = 46;
      for (var x = -H; x < W; x += 130) { ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + H, 0); ctx.stroke(); }
      ctx.fillStyle = "#ece4c8"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = Math.round(W / 14) + "px 'Black Ops One', Impact, sans-serif";
      ctx.fillText(T[lang].placeholder, W / 2, H / 2);
    }
    caption(el.topText.value, "top");
    caption(el.bottomText.value, "bottom");
    if ($("fallbackWrap").classList.contains("on")) showFallback();
  }
  function loadFile(file) {
    if (!file) return;
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function () {
      var max = 1600, s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      el.canvas.width = Math.round(im.naturalWidth * s);
      el.canvas.height = Math.round(im.naturalHeight * s);
      img = im; el.save.disabled = false; status("saveStatus", "");
      draw();
    };
    im.onerror = function () { URL.revokeObjectURL(url); status("saveStatus", T[lang].imgErr, true); };
    im.src = url;
  }
  function status(id, msg, err) { var n = $(id); n.textContent = msg; n.classList.toggle("err", !!err); }
  function showFallback() {
    try { $("fallbackImg").src = el.canvas.toDataURL("image/png"); $("fallbackWrap").classList.add("on"); } catch (e) {}
  }

  var downloads = null;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (d) { downloads = d; }).catch(function () {});
  }
  function saveMeme() {
    if (!img) return;
    el.canvas.toBlob(function (blob) {
      if (blob && !window.claude) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "weaponised-monkey.png";
        document.body.appendChild(a); a.click(); a.remove();
        status("saveStatus", T[lang].saved); return;
      }
      if (!blob || !downloads) { showFallback(); return; }
      downloads.save({ filename: "weaponised-monkey.png", data: blob }).then(function () {
        status("saveStatus", T[lang].saved);
      }).catch(function (e) {
        if (e && e.code === "declined") { status("saveStatus", T[lang].declined); }
        else { status("saveStatus", T[lang].saveErr, true); showFallback(); }
      });
    }, "image/png");
  }

  /* ---------- Language ---------- */
  function applyLang(first) {
    var other = lang === "fr" ? "en" : "fr";
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = T[lang][n.getAttribute("data-i18n")]; });
    $("langFr").setAttribute("aria-pressed", String(lang === "fr"));
    $("langEn").setAttribute("aria-pressed", String(lang === "en"));
    fill(el.species, simple(SPECIES));
    fill(el.faction, simple(FACTIONS));
    fill(el.crowd, simple(CROWDS));
    fill(el.scenario, simple(SCENARIOS));
    fill(el.decor, simple(DECORS));
    fill(el.moment, simple(MOMENTS));
    fill(el.style, simple(STYLES));
    fill(el.ratio, simple(RATIOS));
    fill(el.emote, simple(EMOTES));
    fillGroup(); fillWeapons();
    if (first || el.topText.value === T[other].defTop) el.topText.value = T[lang].defTop;
    if (first || el.bottomText.value === T[other].defBottom) el.bottomText.value = T[lang].defBottom;
    status("copyStatus", "");
    buildPrompt(); draw();
  }
  function setLang(l) { lang = l; try { localStorage.setItem("wm-lang", l); } catch (e) {} applyLang(false); }
  function setMode(m, groupId, weaponId) {
    mode = m;
    $("modeNation").setAttribute("aria-pressed", String(m === "nation"));
    $("modeType").setAttribute("aria-pressed", String(m === "type"));
    fillGroup(groupId); fillWeapons(weaponId); buildPrompt();
  }

  /* ---------- Events ---------- */
  $("langFr").addEventListener("click", function () { setLang("fr"); });
  $("langEn").addEventListener("click", function () { setLang("en"); });
  $("modeNation").addEventListener("click", function () {
    var w = find(WEAPONS, el.weapon.value); setMode("nation", w[1], w[0]);
  });
  $("modeType").addEventListener("click", function () {
    var w = find(WEAPONS, el.weapon.value); setMode("type", w[2], w[0]);
  });
  el.group.addEventListener("change", function () { fillWeapons(); buildPrompt(); });
  document.querySelectorAll("#count button").forEach(function (b) {
    b.addEventListener("click", function () { setCount(Number(b.getAttribute("data-n"))); });
  });
  $("outImage").addEventListener("click", function () { setOut("image"); });
  $("outVideo").addEventListener("click", function () { setOut("video"); });
  ["species", "weapon", "faction", "crowd", "scenario", "decor", "moment", "style", "ratio", "emote"].forEach(function (k) {
    el[k].addEventListener("change", function () { status("copyStatus", ""); buildPrompt(); });
  });
  $("random").addEventListener("click", function () {
    squad = squad.map(function () { return { s: pick(SPECIES)[0], w: pick(WEAPONS)[0] }; });
    el.faction.value = pick(FACTIONS)[0];
    el.scenario.value = pick(SCENARIOS)[0];
    el.decor.value = pick(DECORS)[0];
    el.moment.value = pick(MOMENTS)[0];
    el.style.value = pick(STYLES)[0];
    el.emote.value = pick(EMOTES)[0];
    selectMember(active);
  });
  $("copy").addEventListener("click", function () {
    var done = function () { status("copyStatus", T[lang].copied); };
    var fail = function () { el.prompt.focus(); el.prompt.select(); status("copyStatus", T[lang].copyFail, true); };
    try { navigator.clipboard.writeText(el.prompt.value).then(done, fail); } catch (e) { fail(); }
  });
  ["toGemini", "toHiggs"].forEach(function (id) {
    $(id).addEventListener("click", function () {
      try { navigator.clipboard.writeText(lead() + el.prompt.value).then(function () { status("copyStatus", T[lang].copied); }, function () {}); } catch (e) {}
    });
  });
  $("file").addEventListener("change", function (e) { loadFile(e.target.files && e.target.files[0]); });
  el.topText.addEventListener("input", draw);
  el.bottomText.addEventListener("input", draw);
  el.save.addEventListener("click", saveMeme);

  /* ---------- Start: opens on the combo from the photo that inspired the site ---------- */
  applyLang(true);
  el.faction.value = "guerrilla";
  selectMember(0);
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load("40px Anton"), document.fonts.load("40px 'Black Ops One'")]).then(draw, draw);
  }
})();
</script>
</body>
</html>
